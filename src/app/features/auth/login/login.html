<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <mat-card class="max-w-md w-full p-8 shadow-lg">
    <mat-card-header class="flex flex-col items-center mb-6">
      <mat-card-title class="text-2xl font-bold text-blue-700">SIS704</mat-card-title>
      <mat-card-subtitle>Ingresa tus credenciales para continuar</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <mat-form-field class="w-full">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" placeholder="ej: jperez">
        <mat-icon matSuffix>person</mat-icon>
        <mat-error *ngIf="loginForm.controls.username.hasError('required')">
          El usuario es obligatorio
        </mat-error>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.controls.password.hasError('required')">
          La contraseña es obligatoria
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit"
              class="w-full py-6 text-lg mt-4"
              [disabled]="loginForm.invalid">
        INICIAR SESIÓN
      </button>

    </form>
  </mat-card>
</div>
