<div class="grid-dos">
  <mat-toolbar class="mat-toolbar-title">
    <div>
      <h1>GESTIÓN DE PLANES</h1>
    </div>
  </mat-toolbar>
  <div></div>
  <mat-form-field class="ocultar-subtexto">
    <mat-label>Buscar...</mat-label>
    <input matInput type="text" [formControl]="inputSearch" />
    @if (inputSearch.value) {
      <button matSuffix mat-icon-button (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
  <div></div>
</div>
<br />
<table
  mat-table
  [dataSource]="dsPlan"
  matSort
  matSortDisableClear
  matSortActive="firstName"
  matSortDirection="asc"
>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns" class="fila-tabla"></tr>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombres</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="downloadSpeed">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Velocidad de descarga</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.downloadSpeed }}
    </td>
  </ng-container>

  <ng-container matColumnDef="uploadSpeed">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Velocidad de subida</th>
    <td mat-cell *matCellDef="let row" class="lighter">{{ row.uploadSpeed }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.price }}
    </td>
  </ng-container>

  <ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Activo</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.isActive ? 'Si' : 'No' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>
      <div class="columna-acciones-titulo">
        <span>ACCIONES</span>
        <button
          mat-icon-button
          color="primary"
          (click)="openPlanDialog(null)"
        >
          <mat-icon>add_circle</mat-icon>
        </button>
      </div>
    </th>
    <td mat-cell *matCellDef="let row">
      <div class="columna-acciones">
        <button mat-icon-button (click)="openPlanDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onConfirmDeletePlan(row.idPlan)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>
</table>
<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[10, 20, 50]"
  [showFirstLastButtons]="true"
/>
