<div class="grid-dos">
  <mat-toolbar class="mat-toolbar-title">
    <div>
      <h1>GESTIÓN DE DISPOSITIVOS CONECTADOS</h1>
    </div>
  </mat-toolbar>
  <div></div>
  <mat-form-field class="ocultar-subtexto">
    <mat-label>Buscar...</mat-label>
    <input matInput type="text" [formControl]="inputSearch" />
    @if (inputSearch.value) {
      <button matSuffix mat-icon-button (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
  <div></div>
</div>
<br />
<table
  mat-table
  [dataSource]="dsNetworkDetail"
  matSort
  matSortDisableClear
  matSortActive="subscriptionCode"
  matSortDirection="asc"
>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns" class="fila-tabla"></tr>

  <ng-container matColumnDef="subscriptionCode">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Subscripción</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.subscription.code }}
    </td>
  </ng-container>

  <ng-container matColumnDef="deviceHostname">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Equipo</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.deviceHostname }}
    </td>
  </ng-container>

  <ng-container matColumnDef="deviceType">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.deviceType?.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="ipAddress">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Dirección IP</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.ipAddress }}
    </td>
  </ng-container>

  <ng-container matColumnDef="macAddress">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Dirección MAC</th>
    <td mat-cell *matCellDef="let row" class="lighter">
      {{ row.macAddress }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>
      <div class="columna-acciones-titulo">
        <span>ACCIONES</span>
        <button
          mat-icon-button
          color="primary"
          (click)="openNetworkDetailDialog(null)"
        >
          <mat-icon>add_circle</mat-icon>
        </button>
      </div>
    </th>
    <td mat-cell *matCellDef="let row">
      <div class="columna-acciones">
        <button mat-icon-button (click)="openNetworkDetailDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onConfirmDeleteNetworkDetail(row.idNetworkDetail)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>
</table>
<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[10, 20, 50]"
  [showFirstLastButtons]="true"
/>
